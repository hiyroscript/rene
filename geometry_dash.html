<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        .game-container {
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
        }
        
        .instructions {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="instructions">Press SPACE or Click to Jump</div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        canvas.width = 800;
        canvas.height = 400;
        
        // Physics constants
        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        const GROUND_Y = 340;
        
        // Game objects
        const player = {
            x: 150,
            y: GROUND_Y - 20,
            radius: 20,
            rotation: 0,
            rotationSpeed: 0.08,
            velocityY: 0,
            isJumping: false,
            trail: []
        };
        
        const floor = {
            y: GROUND_Y,
            height: 60
        };
        
        // Background particles
        const particles = [];
        for (let i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * (GROUND_Y - 50),
                size: Math.random() * 3 + 1,
                speed: Math.random() * 0.5 + 0.2,
                opacity: Math.random() * 0.5 + 0.2
            });
        }
        
        // Draw background particles
        function drawBackground() {
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                ctx.fill();
                
                p.x -= p.speed;
                if (p.x < -10) {
                    p.x = canvas.width + 10;
                }
            });
        }
        
        // Draw the floor with gradient and pattern
        function drawFloor() {
            // Floor gradient
            const gradient = ctx.createLinearGradient(0, floor.y, 0, floor.y + floor.height);
            gradient.addColorStop(0, '#2C3E50');
            gradient.addColorStop(1, '#1A252F');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, floor.y, canvas.width, floor.height);
            
            // Top border line (thin white outline as requested)
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, floor.y);
            ctx.lineTo(canvas.width, floor.y);
            ctx.stroke();
            
            // Add some decorative lines on the floor
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, floor.y);
                ctx.lineTo(i - 20, floor.y + floor.height);
                ctx.stroke();
            }
        }
        
        // Draw player trail
        function drawTrail() {
            player.trail.forEach((pos, index) => {
                const alpha = index / player.trail.length * 0.5;
                const size = player.radius * (index / player.trail.length);
                
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();
                ctx.strokeStyle = `rgba(0, 0, 0, ${alpha})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            });
        }
        
        // Draw the player (circle)
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.rotation);
            
            // White circle with thin black outline
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            
            // Add glow effect
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            ctx.shadowBlur = 10;
            
            ctx.fillStyle = 'white';
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Add a small inner detail to show rotation better
            ctx.beginPath();
            ctx.arc(8, -8, 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fill();
            
            ctx.restore();
        }
        
        // Update game state
        function update() {
            // Apply gravity
            player.velocityY += GRAVITY;
            player.y += player.velocityY;
            
            // Ground collision
            if (player.y >= GROUND_Y - player.radius) {
                player.y = GROUND_Y - player.radius;
                player.velocityY = 0;
                player.isJumping = false;
            } else {
                player.isJumping = true;
            }
            
            // Rotate the player (faster when jumping)
            player.rotation += player.rotationSpeed * (player.isJumping ? 1.5 : 1);
            
            // Update trail
            player.trail.push({ x: player.x, y: player.y });
            if (player.trail.length > 10) {
                player.trail.shift();
            }
        }
        
        // Jump function
        function jump() {
            if (!player.isJumping) {
                player.velocityY = JUMP_FORCE;
                player.isJumping = true;
                
                // Create jump particles
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: player.x,
                        y: player.y + player.radius,
                        size: Math.random() * 4 + 2,
                        speed: (Math.random() - 0.5) * 2,
                        opacity: 0.8,
                        velocityY: -Math.random() * 2
                    });
                }
            }
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });
        
        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });
        
        // Main game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw everything
            drawBackground();
            drawFloor();
            drawTrail();
            drawPlayer();
            
            // Update
            update();
            
            // Continue loop
            requestAnimationFrame(gameLoop);
        }
        
        // Start the game
        gameLoop();
    </script>
</body>
</html>
